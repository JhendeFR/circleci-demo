version: 2.1

executors:
  node-executor:
    docker:
      - image: cimg/node:20.11
    working_directory: ~/project

jobs:
  # 1. INSTALACION
  build_and_install:
    executor: node-executor
    steps:
      - checkout
      - restore_cache:
          keys:
            - v1-deps-{{ checksum "package.json" }}
            - v1-deps-
      - run:
          name: Instalar dependencias con npm ci
          command: npm ci
      - save_cache:
          key: v1-deps-{{ checksum "package.json" }}
          paths:
            - node_modules
      - persist_to_workspace:
          root: .
          paths:
            - node_modules

  # 2.PRUEBAS UNITARIAS
  run_tests:
    executor: node-executor
    steps:
      - checkout
      - attach_workspace:
          at: .
      - run:
          name: Ejecutar pruebas unitarias con Jest
          command: npm test
      - store_test_results:
          path: reports
      - store_artifacts:
          path: reports
          destination: test-reports

  # 3. DESPLIEGUE A STAGING
  deploy_staging:
    executor: node-executor
    steps:
      - checkout
      - run:
          name: Despliegue en Staging
          command: |
            echo "=== Despliegue en Ambiente de Staging ==="
            echo "Verificación de suite de pruebas completada exitosamente."
            echo "Artefacto listo para distribución. Commit: $CIRCLE_SHA1"

# 4.PIPELINE
workflows:
  version: 2
  logistics_pipeline:
    jobs:
      - build_and_install
      - run_tests:
          requires:
            - build_and_install
      - deploy_staging:
          requires:
            - run_tests
          filters:
            branches:
              only: main

